services:

  postgres:
    image: postgres:15
    container_name: clinic-postgres
    environment:
      POSTGRES_DB: clinic_db
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  patient-service:
    build: ../services/patient-service
    container_name: clinic-patient-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinic_db
      SPRING_DATASOURCE_USERNAME: clinic
      SPRING_DATASOURCE_PASSWORD: clinic
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  doctor-service:
    build: ../services/doctor-service
    container_name: clinic-doctor-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinic_db
      SPRING_DATASOURCE_USERNAME: clinic
      SPRING_DATASOURCE_PASSWORD: clinic
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  appointment-service:
    build: ../services/appointmentservice
    container_name: clinic-appointment-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinic_db
      SPRING_DATASOURCE_USERNAME: clinic
      SPRING_DATASOURCE_PASSWORD: clinic
    depends_on:
      postgres:
        condition: service_healthy

  imaging-service:
    build: ../services/imaging-service
    container_name: clinic-imaging-service
    ports:
      - "8084:8084"

  diagnostic-service:
    build: ../services/diagnostic-service
    container_name: clinic-diagnostic-service
    ports:
      - "8085:8085"

  facility-service:
    build: ../services/facility-service
    container_name: clinic-facility-service
    ports:
      - "8086:8086"

  api-gateway:
    build: ../services/api-gateway
    container_name: clinic-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - patient-service
      - doctor-service
      - appointment-service
      - imaging-service
      - diagnostic-service
      - facility-service

  # ── Observability ──────────────────────────────────────────────────────────

  zipkin:
    image: openzipkin/zipkin:3
    container_name: clinic-zipkin
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: clinic-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  loki:
    image: grafana/loki:2.9.7
    container_name: clinic-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:10.4.3
    container_name: clinic-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki