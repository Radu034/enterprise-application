global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: patient-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['patient-service:8081']

  - job_name: appointment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['appointment-service:8082']

  - job_name: doctor-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['doctor-service:8083']

  - job_name: imaging-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['imaging-service:8084']

  - job_name: diagnostic-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['diagnostic-service:8085']

  - job_name: facility-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['facility-service:8086']
