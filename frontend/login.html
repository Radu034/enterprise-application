<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — ClinicApp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>🏥 ClinicApp</h1>
</header>

<div class="auth-wrapper">
    <div class="auth-box">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your account</p>

        <div class="role-tabs">
            <button class="role-tab active" id="tab-patient" onclick="setRole('patient')">Patient</button>
            <button class="role-tab" id="tab-doctor" onclick="setRole('doctor')">Doctor</button>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input id="password" type="password" placeholder="••••••••">
        </div>

        <div style="text-align:right; margin: -4px 0 12px;">
            <a href="forgot-password.html" style="font-size:13px;">Forgot password?</a>
        </div>

        <div id="msg"></div>

        <button class="btn" onclick="login()">Sign In</button>

        <div class="auth-link">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>
</div>

<script>
    let role = 'patient';

    function setRole(r) {
        role = r;
        document.getElementById('tab-patient').classList.toggle('active', r === 'patient');
        document.getElementById('tab-doctor').classList.toggle('active', r === 'doctor');
    }

    function showMsg(text, type) {
        const el = document.getElementById('msg');
        el.className = 'msg ' + type;
        el.textContent = text;
    }

    async function login() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) { showMsg('Please fill in all fields.', 'error'); return; }

        const port = role === 'patient' ? 8081 : 8083;

        try {
            const res = await fetch(`http://localhost:${port}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (res.status === 401) { showMsg('Invalid email or password.', 'error'); return; }
            if (!res.ok) { showMsg('Server error. Please try again.', 'error'); return; }

            const user = await res.json();
            user.role = role;
            localStorage.setItem('user', JSON.stringify(user));

            window.location.href = role === 'patient' ? 'dashboard.html' : 'doctor-dashboard.html';

        } catch (err) {
            showMsg('Cannot connect. Is the service running?', 'error');
        }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
