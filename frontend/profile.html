<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile — ClinicApp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>🏥 ClinicApp</h1>
    <nav class="header-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html" class="active">My Profile</a>
        <a href="appointments.html">Appointments</a>
    </nav>
    <span class="header-user" id="headerUser"></span>
</header>

<div class="page">
    <div class="flex-between mt-8">
        <div>
            <div class="page-title">My Profile</div>
            <div class="page-subtitle">Manage your personal and medical information</div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="logout()">Sign Out</button>
    </div>

    <div class="two-col">
        <!-- Summary card -->
        <div>
            <div class="card">
                <div class="profile-avatar" id="avatarInitials">?</div>
                <div style="font-size:20px;font-weight:700" id="profileName">—</div>
                <div style="font-size:14px;color:#6b7280;margin-top:2px" id="profileEmail">—</div>
                <hr class="divider">
                <div class="text-muted" style="font-size:13px;line-height:2">
                    <div>📞 <span id="displayPhone">—</span></div>
                    <div>🎂 <span id="displayBirth">—</span></div>
                    <div>🏠 <span id="displayAddress">—</span></div>
                    <div>🩸 Blood type: <strong id="displayBlood">—</strong></div>
                    <div>🆘 Emergency: <span id="displayEmergency">—</span></div>
                </div>
            </div>
        </div>

        <!-- Edit form -->
        <div>
            <div class="card">
                <div class="card-title">Edit Information</div>
                <div class="profile-grid">
                    <div class="form-group">
                        <label>First Name</label>
                        <input id="firstName" placeholder="John">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input id="lastName" placeholder="Doe">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input id="phone" type="tel" placeholder="+40 700 000 000">
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input id="birthDate" type="date">
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label>Address</label>
                        <input id="address" placeholder="Street, City, Country">
                    </div>
                    <div class="form-group">
                        <label>Blood Type</label>
                        <select id="bloodType">
                            <option value="">— Unknown —</option>
                            <option>A+</option><option>A-</option>
                            <option>B+</option><option>B-</option>
                            <option>AB+</option><option>AB-</option>
                            <option>O+</option><option>O-</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Emergency Contact</label>
                        <input id="emergencyContact" placeholder="Name — +40 ...">
                    </div>
                </div>
                <div id="msg"></div>
                <button class="btn mt-16" onclick="saveProfile()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!user || user.role !== 'patient') { window.location.href = 'login.html'; }

    document.getElementById('headerUser').textContent = `${user.firstName} ${user.lastName}`;

    function logout() { localStorage.removeItem('user'); window.location.href = 'login.html'; }

    function showMsg(text, type) {
        const el = document.getElementById('msg');
        el.className = 'msg ' + type;
        el.textContent = text;
    }

    function populateForm(u) {
        document.getElementById('firstName').value        = u.firstName || '';
        document.getElementById('lastName').value         = u.lastName  || '';
        document.getElementById('phone').value            = u.phone     || '';
        document.getElementById('birthDate').value        = u.birthDate || '';
        document.getElementById('address').value          = u.address   || '';
        document.getElementById('bloodType').value        = u.bloodType || '';
        document.getElementById('emergencyContact').value = u.emergencyContact || '';

        const initials = ((u.firstName||'?')[0] + (u.lastName||'?')[0]).toUpperCase();
        document.getElementById('avatarInitials').textContent = initials;
        document.getElementById('profileName').textContent    = `${u.firstName} ${u.lastName}`;
        document.getElementById('profileEmail').textContent   = u.email;
        document.getElementById('displayPhone').textContent   = u.phone || 'Not set';
        document.getElementById('displayBirth').textContent   = u.birthDate
            ? new Date(u.birthDate).toLocaleDateString('en-GB', { day:'2-digit', month:'long', year:'numeric' })
            : 'Not set';
        document.getElementById('displayAddress').textContent   = u.address   || 'Not set';
        document.getElementById('displayBlood').textContent     = u.bloodType || 'Unknown';
        document.getElementById('displayEmergency').textContent = u.emergencyContact || 'Not set';
    }

    async function loadProfile() {
        try {
            const res = await fetch(`http://localhost:8081/patients/${user.id}`);
            if (res.ok) {
                const fresh = await res.json();
                fresh.role = 'patient';
                localStorage.setItem('user', JSON.stringify(fresh));
                populateForm(fresh);
                return;
            }
        } catch {}
        populateForm(user);
    }

    async function saveProfile() {
        const body = {
            firstName:        document.getElementById('firstName').value.trim(),
            lastName:         document.getElementById('lastName').value.trim(),
            phone:            document.getElementById('phone').value.trim(),
            birthDate:        document.getElementById('birthDate').value || null,
            address:          document.getElementById('address').value.trim(),
            bloodType:        document.getElementById('bloodType').value,
            emergencyContact: document.getElementById('emergencyContact').value.trim()
        };

        if (!body.firstName || !body.lastName) {
            showMsg('First and last name are required.', 'error'); return;
        }

        try {
            const res = await fetch(`http://localhost:8081/patients/${user.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!res.ok) { showMsg('Failed to save. Please try again.', 'error'); return; }

            const updated = await res.json();
            updated.role = 'patient';
            localStorage.setItem('user', JSON.stringify(updated));
            populateForm(updated);
            showMsg('Profile saved successfully!', 'success');
        } catch {
            showMsg('Cannot connect to server.', 'error');
        }
    }

    loadProfile();
</script>
</body>
</html>
