<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register — ClinicApp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>🏥 ClinicApp</h1>
</header>

<div class="auth-wrapper">
    <div class="auth-box">
        <h2>Create account</h2>
        <p class="subtitle">Join ClinicApp today</p>

        <div class="role-tabs">
            <button class="role-tab active" id="tab-patient" onclick="setRole('patient')">Patient</button>
            <button class="role-tab" id="tab-doctor" onclick="setRole('doctor')">Doctor</button>
        </div>

        <div class="form-group">
            <label>First Name</label>
            <input id="firstName" placeholder="John">
        </div>
        <div class="form-group">
            <label>Last Name</label>
            <input id="lastName" placeholder="Doe">
        </div>
        <div class="form-group" id="specialty-group" style="display:none">
            <label>Specialty</label>
            <select id="specialty">
                <option value="">— Select specialty —</option>
                <option>General Practitioner</option>
                <option>Cardiologist</option>
                <option>Dermatologist</option>
                <option>Neurologist</option>
                <option>Orthopedist</option>
                <option>Pediatrician</option>
                <option>Psychiatrist</option>
                <option>Radiologist</option>
                <option>Surgeon</option>
                <option>Urologist</option>
            </select>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input id="password" type="password" placeholder="Min. 6 characters" oninput="checkStrength(); checkMatch();">
        </div>
        <div id="strengthBar" style="height:5px;border-radius:3px;background:#eee;margin:-8px 0 6px;transition:all 0.3s;"></div>
        <div id="strengthLabel" style="font-size:12px;margin-bottom:10px;"></div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input id="confirmPassword" type="password" placeholder="Re-enter your password" oninput="checkMatch()">
        </div>
        <div id="matchMsg" style="font-size:13px;margin:-6px 0 10px;"></div>

        <div id="msg"></div>

        <button class="btn" onclick="register()">Create Account</button>

        <div class="auth-link">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>
</div>

<script>
    let role = 'patient';

    function setRole(r) {
        role = r;
        document.getElementById('tab-patient').classList.toggle('active', r === 'patient');
        document.getElementById('tab-doctor').classList.toggle('active', r === 'doctor');
        document.getElementById('specialty-group').style.display = r === 'doctor' ? 'block' : 'none';
    }

    function showMsg(text, type) {
        const el = document.getElementById('msg');
        el.className = 'msg ' + type;
        el.textContent = text;
    }

    function checkStrength() {
        const v = document.getElementById('password').value;
        let s = 0;
        if (v.length >= 8)           s++;
        if (/[A-Z]/.test(v))         s++;
        if (/[0-9]/.test(v))         s++;
        if (/[^A-Za-z0-9]/.test(v))  s++;
        const colors = ['#eee','#e74c3c','#e67e22','#f1c40f','#27ae60'];
        const labels = ['','Weak','Fair','Good','Strong'];
        document.getElementById('strengthBar').style.background = colors[s];
        document.getElementById('strengthBar').style.width = (s * 25) + '%';
        document.getElementById('strengthLabel').textContent = labels[s];
        document.getElementById('strengthLabel').style.color = colors[s];
    }

    function checkMatch() {
        const pw  = document.getElementById('password').value;
        const cpw = document.getElementById('confirmPassword').value;
        const el  = document.getElementById('matchMsg');
        if (!cpw) { el.textContent = ''; return; }
        if (pw === cpw) { el.textContent = '✅ Passwords match'; el.style.color = 'green'; }
        else            { el.textContent = '❌ Passwords do not match'; el.style.color = 'red'; }
    }

    async function register() {
        const firstName = document.getElementById('firstName').value.trim();
        const lastName  = document.getElementById('lastName').value.trim();
        const email     = document.getElementById('email').value.trim();
        const password  = document.getElementById('password').value.trim();
        const confirm   = document.getElementById('confirmPassword').value.trim();
        const specialty = document.getElementById('specialty').value;

        if (!firstName || !lastName || !email || !password) {
            showMsg('Please fill in all required fields.', 'error'); return;
        }
        if (password.length < 6) {
            showMsg('Password must be at least 6 characters.', 'error'); return;
        }
        if (password !== confirm) {
            showMsg('Passwords do not match.', 'error'); return;
        }
        if (role === 'doctor' && !specialty) {
            showMsg('Please select a specialty.', 'error'); return;
        }

        const port = role === 'patient' ? 8081 : 8083;
        const body = role === 'patient'
            ? { firstName, lastName, email, password }
            : { firstName, lastName, email, password, specialty };

        try {
            const res = await fetch(`http://localhost:${port}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.status === 409) { showMsg('An account with this email already exists.', 'error'); return; }
            if (!res.ok) { showMsg('Registration failed. Please try again.', 'error'); return; }

            const user = await res.json();
            user.role = role;
            localStorage.setItem('user', JSON.stringify(user));

            showMsg('Account created! Redirecting…', 'success');
            setTimeout(() => {
                window.location.href = role === 'patient' ? 'dashboard.html' : 'doctor-dashboard.html';
            }, 900);

        } catch (err) {
            showMsg('Cannot connect. Is the service running?', 'error');
        }
    }
</script>
</body>
</html>
