<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Appointments — ClinicApp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>🏥 ClinicApp — Doctor Portal</h1>
    <nav class="header-nav">
        <a href="doctor-dashboard.html">Dashboard</a>
        <a href="doctor-profile.html">My Profile</a>
        <a href="doctor-appointments.html" class="active">Appointments</a>
    </nav>
    <span class="header-user" id="headerUser"></span>
</header>

<div class="page">
    <div class="flex-between mt-8">
        <div>
            <div class="page-title">Appointments</div>
            <div class="page-subtitle">Manage all patient appointment requests</div>
        </div>
        <div class="flex-gap">
            <select id="filterStatus" onchange="applyFilter()" style="width:auto;padding:8px 12px;font-size:13px">
                <option value="">All statuses</option>
                <option value="PENDING">Pending</option>
                <option value="CONFIRMED">Confirmed</option>
                <option value="COMPLETED">Completed</option>
                <option value="CANCELLED">Cancelled</option>
            </select>
            <button class="btn btn-secondary btn-sm" onclick="logout()">Sign Out</button>
        </div>
    </div>

    <!-- Pending requests (highlighted) -->
    <div class="card" id="pendingSection">
        <div class="card-title">⏳ Pending Requests</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Patient</th><th>Date &amp; Time</th><th>Reason</th><th>Requested</th><th>Actions</th></tr>
                </thead>
                <tbody id="pendingTable">
                    <tr><td colspan="5" class="text-muted text-center" style="padding:16px">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- All appointments -->
    <div class="card">
        <div class="card-title">All Appointments</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Patient</th><th>Date &amp; Time</th><th>Reason</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="allTable">
                    <tr><td colspan="5" class="text-muted text-center" style="padding:16px">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!user || user.role !== 'doctor') { window.location.href = 'login.html'; }

    document.getElementById('headerUser').textContent = `Dr. ${user.firstName} ${user.lastName}`;
    function logout() { localStorage.removeItem('user'); window.location.href = 'login.html'; }

    let allAppointments = [];

    async function loadAppointments() {
        try {
            const res = await fetch(`http://localhost:8082/appointments/doctor/${user.id}`);
            if (!res.ok) throw new Error();
            allAppointments = await res.json();
            applyFilter();
        } catch {
            const msg = '<tr><td colspan="5" class="text-muted text-center" style="padding:16px">Could not load appointments.</td></tr>';
            document.getElementById('pendingTable').innerHTML = msg;
            document.getElementById('allTable').innerHTML = msg;
        }
    }

    function applyFilter() {
        const filter = document.getElementById('filterStatus').value;
        const filtered = filter ? allAppointments.filter(a => a.status === filter) : allAppointments;
        renderPendingTable(allAppointments.filter(a => a.status === 'PENDING'));
        renderAllTable(filtered);
    }

    function fmtDate(dt) {
        return new Date(dt).toLocaleString('en-GB', {
            day: '2-digit', month: 'short', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    function renderPendingTable(pending) {
        const tbody = document.getElementById('pendingTable');
        document.getElementById('pendingSection').style.display = pending.length ? 'block' : 'none';
        if (!pending.length) { tbody.innerHTML = ''; return; }

        tbody.innerHTML = pending.map(a => `
            <tr style="background:#fffbeb">
                <td><strong>${a.patientName}</strong></td>
                <td>${fmtDate(a.dateTime)}</td>
                <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.reason || '—'}</td>
                <td class="text-muted" style="font-size:12px">${fmtDate(a.createdAt)}</td>
                <td class="flex-gap" style="gap:6px">
                    <button class="btn btn-success btn-sm" onclick="setStatus(${a.id},'CONFIRMED')">Confirm</button>
                    <button class="btn btn-danger btn-sm"  onclick="setStatus(${a.id},'CANCELLED')">Decline</button>
                </td>
            </tr>
        `).join('');
    }

    function renderAllTable(list) {
        const tbody = document.getElementById('allTable');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-muted text-center" style="padding:20px">No appointments found.</td></tr>';
            return;
        }

        tbody.innerHTML = list.map(a => `
            <tr>
                <td><strong>${a.patientName}</strong></td>
                <td>${fmtDate(a.dateTime)}</td>
                <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.reason || '—'}</td>
                <td><span class="badge badge-${a.status.toLowerCase()}">${a.status}</span></td>
                <td class="flex-gap" style="gap:6px">
                    ${a.status === 'PENDING'    ? `<button class="btn btn-success btn-sm" onclick="setStatus(${a.id},'CONFIRMED')">Confirm</button>` : ''}
                    ${a.status === 'CONFIRMED'  ? `<button class="btn btn-sm" onclick="setStatus(${a.id},'COMPLETED')">Complete</button>` : ''}
                    ${(a.status === 'PENDING' || a.status === 'CONFIRMED')
                        ? `<button class="btn btn-danger btn-sm" onclick="setStatus(${a.id},'CANCELLED')">Cancel</button>` : ''}
                    ${a.status === 'CANCELLED' || a.status === 'COMPLETED' ? '<span class="text-muted">—</span>' : ''}
                </td>
            </tr>
        `).join('');
    }

    async function setStatus(id, status) {
        const labels = { CONFIRMED: 'confirm', CANCELLED: 'cancel', COMPLETED: 'mark as completed' };
        if (!confirm(`Are you sure you want to ${labels[status] || 'update'} this appointment?`)) return;

        try {
            const res = await fetch(`http://localhost:8082/appointments/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            if (!res.ok) throw new Error();
            await loadAppointments();
        } catch {
            alert('Could not update appointment status. Please try again.');
        }
    }

    loadAppointments();
</script>
</body>
</html>
